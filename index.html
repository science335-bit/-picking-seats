 const los=(a,b)=>{const dd=Math.hypot(b[0]-a[0],b[1]-a[1]),st=Math.max(1,Math.ceil(dd/.1));for(let q=0;q<=st;q++){const c=cell(a[0]+(b[0]-a[0])*q/st,a[1]+(b[1]-a[1])*q/st);if(bl(c[0],c[1]))return false}return true};
 const out=[];let a=0;while(a<pts_.length-1){let b=pts_.length-1;while(b>a+1&&!los(pts_[a],pts_[b]))b--;out.push(pts_[b]);a=b}return out}
/* ---------- flow ---------- */
function init(){
 names=getNames();n=names.length;cols=+$("cols").value;theme=$("theme").value;phase="idle";done=0;placed=false;seatOf=[];tags=[];setMove(false);
 $("res").disabled=true;$("mv").disabled=false;$("rs").disabled=false;$("go").textContent="🏃 자리배치 시작!";const w=$("who");w.innerHTML='<option value="">내 자리 줌인…</option>'+names.map((x,i)=>'<option value="'+i+'">'+x.replace(/</g,"&lt;")+'</option>').join("");
 if(n<2){$("msg").textContent="이름을 2명 이상 적어주세요";$("go").disabled=true;return}
 $("go").disabled=false;layout();buildRoom();buildCrowd();viewDef();$("msg").textContent=n+"명이 출발선에서 대기 중!"}
function assign(){
 const seats=Array(n).fill(-1),taken={},nameSeat={};let bad=0;
 $("fix").value.split("\n").forEach(l=>{const m=l.split(/[=:]/);if(m.length<2)return;const nm=m[0].trim(),s=parseInt(m[1])-1,i=names.indexOf(nm);
  if(i<0||!(s>=0&&s<n)||taken[s]||nameSeat[i]!==undefined){if(l.trim())bad++;return}taken[s]=1;nameSeat[i]=s;seats[i]=s});
 const free=[];for(let s=0;s<n;s++)if(!taken[s])free.push(s);free.sort(()=>Math.random()-.5);
 for(let i=0;i<n;i++)if(seats[i]<0)seats[i]=free.pop();return{seats,bad}}
function start(){
 if(phase==="run"||n<2)return;
 if(placed){init();setTimeout(start,500);return}
 setMove(false);$("drawer").classList.remove("open");A();const{seats,bad}=assign();placed=true;phase="run";done=0;seatOf=seats;$("go").disabled=true;$("res").disabled=true;$("mv").disabled=true;$("rs").disabled=true;
 $("msg").textContent="삐익~! 출발!"+(bad?" (고정석 "+bad+"줄은 무시됐어요)":"");whistle();buildGrid();
 chars.forEach((c,i)=>{const k=seats[i],p=seatG[k].position;c.seat=k;c.state="wait";c.delay=.7+Math.random()*1.3;
  c.path=findPath(c.g.position.x,c.g.position.z,p.x,p.z+.85,k);c.pi=0;c.jt=0})}
function sitDone(c){const tg=tags[c.seat],t=label((c.seat+1)+"번 "+c.name,320,140,"#fffbe0","#e0357f","#ffd54a");tg.mats.forEach(m=>{m.map=t;m.needsUpdate=true});tg.pop=1.2;
 const p=seatG[c.seat].position;burst(p.x,1,p.z+.1,26,1.1,3.2,[0xffd54a,0xfff3a0,0xffffff]);tone(880+Math.random()*300,.15,"triangle",.08);
 $("msg").textContent="✨ "+(c.seat+1)+"번 자리: "+c.name+" 착석!";
 view(0,1.2,2.6,new V3(p.x,.85,p.z+.35));
 if(++done===n)finish()}
function finish(){phase="done";fanfare();$("msg").textContent="모두 착석 완료! 🎉";$("res").disabled=false;$("go").disabled=false;$("mv").disabled=false;$("rs").disabled=false;$("go").textContent="🎲 다시 뽑기";
 for(let i=0;i<6;i++)setTimeout(()=>burst(rnd(-L.W/3,L.W/3),4,L.cz+rnd(-2,2),70,2.2,2.5),i*180);setTimeout(()=>{viewDef();showRes()},2200)}
function lerpA(a,b,t){const d=((b-a+PI)%(PI*2)+PI*2)%(PI*2)-PI;return a+d*t}
let ft=0;
function update(dt,time){
 ft-=dt;let running=0;const sy=TH[theme].sy-.04;
 chars.forEach((c,i)=>{c.t+=dt;const g=c.g,s=c.state;
  if(s==="wait"){const w=Math.sin(time*3+i*1.7);g.rotation.z=w*.09;g.position.y=Math.abs(w)*.05;c.arms[0].position.y=.36+w*.04;c.arms[1].position.y=.36-w*.04;
   if(phase==="run"){c.delay-=dt;if(c.delay<=0)c.state="run"}}
  else if(s==="run"){running++;const wp=c.path[c.pi],dx=wp[0]-g.position.x,dz=wp[1]-g.position.z,d=Math.hypot(dx,dz),st=c.spd*dt;
   if(d<=st){g.position.x=wp[0];g.position.z=wp[1];if(++c.pi>=c.path.length){c.state="jump";c.jt=0}}else{g.position.x+=dx/d*st;g.position.z+=dz/d*st;g.rotation.y=lerpA(g.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*12))}
   const sn=Math.sin(c.t*14);g.position.y=Math.abs(sn)*.14;g.rotation.z=sn*.07;g.rotation.x=.12;
   c.legs[0].position.z=.05+sn*.2;c.legs[1].position.z=.05-sn*.2;c.legs[0].position.y=.09+Math.max(0,sn)*.09;c.legs[1].position.y=.09+Math.max(0,-sn)*.09;c.arms[0].position.z=.04-sn*.2;c.arms[1].position.z=.04+sn*.2}
  else if(s==="jump"){const p=seatG[c.seat].position;c.jt+=dt/.55;const t=Math.min(1,c.jt);
   g.position.x+=(p.x-g.position.x)*Math.min(1,dt*8);g.position.z+=(p.z+.85-g.position.z)*Math.min(1,dt*8);g.position.y=sy*t+Math.sin(t*PI)*.4;
   g.rotation.y=lerpA(g.rotation.y,PI,Math.min(1,dt*14))+0;g.rotation.x*=.85;g.rotation.z*=.85;
   c.legs.forEach(l=>{l.position.z=.05+.25*t;l.position.y=.09+.1*t});
   if(t>=1){c.state="sit";g.rotation.y=PI;sitDone(c)}}
  else if(s==="sit"){const p=seatG[c.seat].position;g.position.set(p.x,sy+Math.sin(time*2+i)*.01,p.z+.85);g.rotation.y=PI;g.rotation.z=Math.sin(time*1.4+i)*.03;
   c.legs.forEach(l=>{l.position.z=.3;l.position.y=.18});c.arms.forEach((a,j)=>{a.position.z=.18;a.position.y=.46+Math.sin(time*3+i+j)*.02})}
 });
 if(running&&ft<=0){tone(rnd(180,260),.05,"square",.025);ft=.11}
 tags.forEach(t=>{if(t.pop>0){t.pop-=dt*2.5;t.g.scale.setScalar(1+Math.max(0,t.pop)*.6)}})}
/* ---------- results / ui ---------- */
function showRes(){
 const ch=$("chart");ch.innerHTML="";
 const who=[];seatOf.forEach((s,i)=>who[s]=names[i]);
 const xs=seatG.map(g=>g.position.x),zs=seatG.map(g=>g.position.z);
 const minX=Math.min(...xs),maxX=Math.max(...xs),minZ=Math.min(...zs),maxZ=Math.max(...zs);
 const spanX=Math.max(1.5,maxX-minX),spanZ=Math.max(1.5,maxZ-minZ);
 ch.style.height=Math.max(240,Math.min(480,Math.round(spanZ*46)+90))+"px";
 who.forEach((nm,k)=>{
  const p=seatG[k].position;
  const rx=spanX<1.6?50:10+((p.x-minX)/spanX)*80;
  const rz=spanZ<1.6?50:14+((p.z-minZ)/spanZ)*72;
  const d=document.createElement("div");d.className="seat";
  d.style.left=rx+"%";d.style.top=rz+"%";
  d.innerHTML="<b>"+(k+1)+"번</b>";d.append(nm);ch.append(d);
 });
 $("modal").classList.add("on");
}
function resText(){
 const who=[];seatOf.forEach((s,i)=>who[s]=names[i]);
 const items=who.map((nm,k)=>({k,nm,x:seatG[k].position.x,z:seatG[k].position.z})).sort((a,b)=>Math.abs(a.z-b.z)<.7?a.x-b.x:a.z-b.z);
 let o="▶ 칠판/앞쪽 (실제 배치 순서)\n";
 const lines=[];let cur=[],lastZ=null;
 items.forEach(it=>{
  if(lastZ!==null&&Math.abs(it.z-lastZ)>=.7){lines.push(cur);cur=[]}
  cur.push((it.k+1)+"번 "+it.nm);lastZ=it.z;
 });
 if(cur.length)lines.push(cur);
 lines.forEach((row,idx)=>o+=(idx+1)+"줄: "+row.join(" | ")+"\n");
 return o;
}
